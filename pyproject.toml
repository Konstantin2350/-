[project]
name = "ai-orchestra"
version = "1.0.0"
description = "Multi-agent business automation platform for Bitrix24"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.22.1",
  "asyncpg==0.31.0",
  "celery==5.6.3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "pypdf==6.16.1",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
